name: Backend CI

on:
  push:
    branches: [main]
    tags: ["backend-v*"]
    paths: ["backend/**", "seed/**", ".github/workflows/backend.yml"]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyricsflip
  REDIS_URL: redis://localhost:6379
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  JWT_SECRET: ci-secret
  NODE_ENV: test

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Dependency audit (production)
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  openapi:
    name: OpenAPI spec freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Install frontend dependencies (needed for generate:api)
        run: npm ci
        working-directory: frontend
      - name: Export openapi.json and regenerate frontend API client
        run: npm run openapi:export && npm run openapi:generate
      - name: Verify openapi.json is committed and up to date
        run: |
          if ! git diff --quiet -- openapi.json; then
            echo "::error::openapi.json is out of date."
            echo "Run the following, then commit both files:"
            echo "  cd backend && npm run openapi:export && npm run openapi:generate"
            git diff -- openapi.json
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- openapi.json)" ]]; then
            echo "::error::openapi.json is not committed."
            echo "Run: cd backend && npm run openapi:export && npm run openapi:generate"
            echo "Then commit both files."
            exit 1
          fi
      - name: Verify frontend/src/services/generated/api.ts is committed and up to date
        working-directory: frontend
        run: |
          if ! git diff --quiet -- src/services/generated/api.ts; then
            echo "::error::frontend/src/services/generated/api.ts is out of date."
            echo "Run the following, then commit both files:"
            echo "  cd backend && npm run openapi:export && npm run openapi:generate"
            git diff -- src/services/generated/api.ts
            exit 1
          fi
          if [[ -n "$(git status --porcelain -- src/services/generated/api.ts)" ]]; then
            echo "::error::frontend/src/services/generated/api.ts is not committed."
            echo "Run: cd backend && npm run openapi:export && npm run openapi:generate"
            echo "Then commit both files."
            exit 1
          fi

  migrations:
    name: Backend migrations (fresh DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lyricsflip
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run migrations against a fresh database
        run: npm run migration:run
      - name: Check for entity/migration drift
        run: npm run migration:check
      - name: Seed from seed/songs.json
        run: npm run seed

  ci-summary:
    name: Backend CI
    if: always()
    needs: [backend, openapi, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Require backend checks
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.openapi.result }}" != "success" || "${{ needs.migrations.result }}" != "success" ]]; then
            echo "Backend checks did not all pass."
            exit 1
          fi
          echo "Backend checks (including npm audit --omit=dev) passed."
