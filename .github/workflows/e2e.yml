name: e2e

# Runs the three Playwright end-to-end flows (connect + solo round,
# multiplayer lobby, admin card management) on every pull request that
# touches frontend code or the e2e directory.
#
# The stellar/quickstart container is started via the docker-compose soroban
# profile and acted on by the global-setup.ts script. The mocked wallet
# (e2e/fixtures.ts) signs with a fixed keypair so no browser extension is needed.
#
# Part of Issue #907 / LF-321.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/e2e.yml"
      - "docker-compose.yml"

jobs:
  playwright:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Postgres and Redis are needed for the backend that the frontend calls.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lyricsflip
          POSTGRES_PASSWORD: lyricsflip
          POSTGRES_DB: lyricsflip
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lyricsflip -d lyricsflip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Soroban quickstart container
        run: |
          docker compose --profile soroban up -d soroban
        env:
          DOCKER_BUILDKIT: "1"

      - name: Wait for Soroban RPC
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
              http://localhost:8000/soroban/rpc | grep -q '"healthy"'; then
              echo "RPC healthy after ${i} attempts"
              exit 0
            fi
            echo "Waiting for RPC... attempt $i/60"
            sleep 3
          done
          echo "RPC did not become healthy"
          exit 1

      - name: Start backend (for API calls)
        run: docker compose up -d backend
        env:
          DOCKER_BUILDKIT: "1"

      - name: Run Playwright tests
        working-directory: frontend
        env:
          E2E_BASE_URL: ""
          STELLAR_RPC_URL: "http://localhost:8000/soroban/rpc"
          FRIENDBOT_URL: "http://localhost:8000/friendbot"
          NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
          NEXT_PUBLIC_STELLAR_HORIZON_URL: "http://localhost:8000"
          NEXT_PUBLIC_STELLAR_RPC_URL: "http://localhost:8000/soroban/rpc"
          NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
