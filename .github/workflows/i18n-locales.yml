name: i18n Locale Keys

on:
  push:
    paths: ['frontend/messages/**', 'frontend/scripts/check-locale-keys.mjs']
  pull_request:
    paths: ['frontend/messages/**', 'frontend/scripts/check-locale-keys.mjs']

jobs:
  check-locale-keys:
    name: fr.json has all en.json keys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-locale-keys.mjs
