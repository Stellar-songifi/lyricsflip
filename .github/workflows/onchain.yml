name: LyricsFlip Contracts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - run: cargo fmt --check
        working-directory: onchain
      - name: Clippy
        working-directory: onchain
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
          {
            echo "### Clippy"
            echo '```'
            tail -n 20 clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo build --target wasm32v1-none --release
        working-directory: onchain
      - name: Persistent writes must bump TTL (LF-274)
        working-directory: onchain
        run: |
          # Every persistent write must go through the set_persistent helper so
          # the entry's TTL is extended. Allow only the helper's own body.
          if grep -n 'persistent()\.set(' contracts/lyricsflip/src/lib.rs \
              | grep -v 'fn set_persistent' \
              | grep -v 'set_persistent'; then
            echo "::error::persistent().set( found outside the set_persistent helper"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-wasm
          path: onchain/target/wasm32v1-none/release/*.wasm
      - name: Build main for WASM size baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base FETCH_HEAD
          cd ../base/onchain
          cargo build --target wasm32v1-none --release \
            --target-dir "${{ github.workspace }}/onchain/target-base" || true
      - name: WASM sizes (fail on >10% growth over main)
        shell: bash
        working-directory: onchain
        run: |
          fail=0
          {
            echo "### WASM sizes"
            echo "| Contract | Base | PR | Change |"
            echo "|---|---:|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in lyricsflip lyricsflip_nft; do
            new=$(stat -c %s "target/wasm32v1-none/release/$f.wasm")
            base_file="target-base/wasm32v1-none/release/$f.wasm"
            if [[ -f "$base_file" ]]; then
              base=$(stat -c %s "$base_file")
              pct=$(awk -v n="$new" -v b="$base" 'BEGIN { printf "%+.2f", (n - b) * 100 / b }')
              if awk -v n="$new" -v b="$base" 'BEGIN { exit !(n > b * 1.10) }'; then
                fail=1; pct="$pct% ❌"
              else
                pct="$pct%"
              fi
            else
              base="n/a"; pct="n/a"
            fi
            echo "| $f.wasm | $base | $new | $pct |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ $fail -eq 1 ]]; then
            echo "::error::A contract WASM grew by more than 10% over the base branch"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage and generate LCOV
        working-directory: onchain
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov --workspace --text | tee coverage.txt
          cargo llvm-cov --workspace --json --output-path coverage.json
          {
            echo "### Coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          lib_coverage=$(cargo llvm-cov --package lyricsflip --include contracts/lyricsflip/src/lib.rs --fail-under-lines 90 --summary-only)
          {
            echo "### lyricsflip lib.rs coverage (minimum 90%)"
            echo '```'
            echo "$lib_coverage"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contract coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-lcov
          path: onchain/lcov.info
          if-no-files-found: warn
      - name: Contract coverage baseline and PR change
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../base-cov FETCH_HEAD
          cd ../base-cov/onchain
          cargo llvm-cov --workspace --json --output-path "${{ github.workspace }}/onchain/coverage-base.json" || true
          cd "${{ github.workspace }}"
          node -e '
            const fs = require("fs");
            function getTotals(file) {
              if (!fs.existsSync(file)) return null;
              try {
                const j = JSON.parse(fs.readFileSync(file, "utf8"));
                return j.data && j.data[0] && j.data[0].totals ? j.data[0].totals : null;
              } catch (_) {
                return null;
              }
            }
            const pr = getTotals("onchain/coverage.json");
            const base = getTotals("onchain/coverage-base.json");
            let out = "### Contract Coverage Change\n\n";
            if (!pr) {
              out += "PR coverage data not available.\n";
            } else if (!base) {
              const linesPct = pr.lines ? pr.lines.percent.toFixed(2) + "%" : "n/a";
              const fnPct = pr.functions ? pr.functions.percent.toFixed(2) + "%" : "n/a";
              const brPct = pr.regions ? pr.regions.percent.toFixed(2) + "%" : "n/a";
              out += "| Metric | PR |\n|---|---:|\n";
              out += `| Lines | ${linesPct} |\n`;
              out += `| Functions | ${fnPct} |\n`;
              out += `| Regions | ${brPct} |\n`;
            } else {
              out += "| Metric | Base | PR | Change |\n|---|---:|---:|---:|\n";
              for (const [key, label] of [["lines", "Lines"], ["functions", "Functions"], ["regions", "Regions"]]) {
                const bVal = base[key] ? base[key].percent : null;
                const pVal = pr[key] ? pr[key].percent : null;
                const bStr = bVal !== null ? bVal.toFixed(2) + "%" : "n/a";
                const pStr = pVal !== null ? pVal.toFixed(2) + "%" : "n/a";
                let diffStr = "n/a";
                if (bVal !== null && pVal !== null) {
                  const diff = pVal - bVal;
                  diffStr = (diff >= 0 ? "+" : "") + diff.toFixed(2) + "%" + (diff < 0 ? " ⚠️" : "");
                }
                out += `| ${label} | ${bStr} | ${pStr} | ${diffStr} |\n`;
              }
            }
            fs.writeFileSync("onchain/coverage-summary.md", out);
            process.stdout.write(out);
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: Post coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('onchain/coverage-summary.md')) return;
            const summary = fs.readFileSync('onchain/coverage-summary.md', 'utf8');
            const marker = '<!-- contract-coverage-summary -->';
            const body = `${marker}\n${summary}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              core.warning(`Could not comment on PR (${err.message}); summary is available in job summary.`);
            }

  audit:
    name: Dependency audit (LF-243)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        working-directory: onchain
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee audit.log
          {
            echo "### cargo audit"
            echo '```'
            cat audit.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Supply-chain checks (LF-367)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny
        working-directory: onchain
        run: |
          set -o pipefail
          cargo deny check advisories licenses bans 2>&1 | tee deny.log
          {
            echo "### cargo deny"
            echo '```'
            cat deny.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bindings-check:
    name: TypeScript bindings are up to date (LF-032)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Stellar CLI
        uses: taiki-e/install-action@v2
        with:
          tool: stellar-cli
      - name: Check TypeScript bindings are fresh
        run: bash onchain/scripts/check-bindings-fresh.sh

  api-docs-check:
    name: Contract API docs are up to date (LF-182)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/api.md covers every public function, error, and event
        run: bash onchain/scripts/check-api-docs.sh

  ci-summary:
    name: LyricsFlip Contracts
    if: always()
    needs: [build, test, audit, deny, bindings-check, api-docs-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require contract checks
        run: |
          if [[ "${{ needs.build.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs.audit.result }}" != "success" || "${{ needs.deny.result }}" != "success" || "${{ needs.bindings-check.result }}" != "success" || "${{ needs.api-docs-check.result }}" != "success" ]]; then
            echo "Contract checks did not all pass."
            exit 1
          fi
