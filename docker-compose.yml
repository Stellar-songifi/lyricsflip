# Local development stack: Postgres, Redis, Mailpit, the backend API, the
# frontend, the indexer and a local Soroban network with auto-deployed contracts.
#
#   docker compose up                       # full stack on http://localhost:3000
#   docker compose --profile soroban up    # explicit: same as above (soroban
#                                           #   is included in the default stack
#                                           #   but kept under a named profile so
#                                           #   it can still be skipped for
#                                           #   testnet/mainnet-only workflows)
#
# On first run the contracts-init service builds the WASM, deploys the game,
# NFT, and escrow contracts to the local quickstart node, seeds the card
# catalogue, and writes the contract IDs to the `contracts-env` volume.  The
# backend, indexer, and frontend source those IDs before starting.
#
# The frontend is served on http://localhost:3000 and proxies API calls to the
# backend on http://localhost:4000.  Mailpit's web UI (password-reset emails)
# is on http://localhost:8025.
#
# NEXT_PUBLIC_* variables are baked into the Next.js bundle at build time.
# If you need to redeploy contracts, run:
#   docker compose down -v
#   docker compose up --build
# (the -v flag removes the contracts-env volume so IDs are regenerated)

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lyricsflip
      POSTGRES_PASSWORD: lyricsflip
      POSTGRES_DB: lyricsflip
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lyricsflip -d lyricsflip']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/api/v1/info || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Local Stellar / Soroban network
  # ---------------------------------------------------------------------------
  soroban:
    # Pinned for reproducible local builds; bump deliberately when upgrading.
    image: stellar/quickstart:v430
    command: --local --enable rpc
    ports:
      - '8000:8000'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >
          curl -sf -X POST -H "Content-Type: application/json"
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          http://localhost:8000/soroban/rpc || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # contracts-init: one-shot service that deploys contracts and seeds cards.
  # Runs AFTER the quickstart node is healthy; exits 0 on success.
  # The backend, indexer, and frontend wait for it to complete before starting.
  # ---------------------------------------------------------------------------
  contracts-init:
    build:
      context: .
      dockerfile: docker/contracts-init/Dockerfile
    environment:
      SOROBAN_RPC_URL: http://soroban:8000/soroban/rpc
      NETWORK_PASSPHRASE: 'Standalone Network ; February 2017'
      OUTPUT_ENV_FILE: /run/contracts/.env
      CARDS_PER_ROUND: '5'
    volumes:
      - contracts-env:/run/contracts
    depends_on:
      soroban:
        condition: service_healthy
    restart: 'no'

  # ---------------------------------------------------------------------------
  # Backend API (NestJS)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://lyricsflip:lyricsflip@postgres:5432/lyricsflip
      DB_MIGRATIONS_RUN: 'true'
      DB_SYNCHRONIZE: 'true'
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-jwt-secret
      JWT_REFRESH_SECRET: dev-only-refresh-secret
      JWT_TOKEN_AUDIENCE: localhost:4000
      JWT_TOKEN_ISSUER: localhost:4000
      JWT_ACCESS_TOKEN_TTL: 3600
      RATE_LIMIT_TTL: 60000
      RATE_LIMIT_LIMIT: 60
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: debug
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAIL_FROM: 'LyricsFlip <no-reply@lyricsflip.local>'
      APP_URL: http://localhost:3000
      # Contract IDs and Stellar config are sourced from the shared volume by
      # docker-entrypoint.sh; the values below act as safe fallbacks when the
      # soroban profile is not active.
      STELLAR_NETWORK: local
      STELLAR_RPC_URL: http://soroban:8000/soroban/rpc
      SOROBAN_RPC_URL: http://soroban:8000/soroban/rpc
      CONTRACTS_ENV_FILE: /run/contracts/.env
    volumes:
      - contracts-env:/run/contracts:ro
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      contracts-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* args are baked into the bundle at build time.
      # contracts-init must complete before this build runs so the IDs are
      # available; Docker Compose resolves build-time depends_on correctly.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WS_URL: http://localhost:4000
        NEXT_PUBLIC_WAGER_ASSET_CODE: XLM
        NEXT_PUBLIC_STELLAR_HORIZON_URL: http://localhost:8000
        NEXT_PUBLIC_STELLAR_RPC_URL: http://localhost:8000/soroban/rpc
        NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: 'Standalone Network ; February 2017'
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
      API_INTERNAL_URL: http://backend:4000
      CONTRACTS_ENV_FILE: /run/contracts/.env
    volumes:
      - contracts-env:/run/contracts:ro
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
      contracts-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Indexer (runs the same backend image with RUN_INDEXER=true)
  # ---------------------------------------------------------------------------
  indexer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      RUN_INDEXER: 'true'
      DATABASE_URL: postgres://lyricsflip:lyricsflip@postgres:5432/lyricsflip
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: local
      STELLAR_RPC_URL: http://soroban:8000/soroban/rpc
      SOROBAN_RPC_URL: http://soroban:8000/soroban/rpc
      LOG_LEVEL: debug
      CONTRACTS_ENV_FILE: /run/contracts/.env
    volumes:
      - contracts-env:/run/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      contracts-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  # Shared volume: contracts-init writes contract IDs here; backend, indexer,
  # and frontend mount it read-only and source /run/contracts/.env at startup.
  contracts-env:
