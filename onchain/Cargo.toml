[workspace]
resolver = "2"
members = [
  "contracts/lyricsflip",
  "contracts/lyricsflip-nft",
  "contracts/upgrade-fixture",
]

[workspace.dependencies]
soroban-sdk = "28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
