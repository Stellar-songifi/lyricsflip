[package]
name = "lyricsflip"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
lyricsflip-nft = { path = "../lyricsflip-nft" }

[features]
testutils = ["soroban-sdk/testutils"]
